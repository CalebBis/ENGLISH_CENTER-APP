name: english_center_app
description: Application de gestion pour centre d'anglais
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # Database
  sqlite3: ^2.9.4
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.0

  # UI and Navigation
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^17.2.3

  # Calendar and Date
  table_calendar: ^3.0.0
  
  # Charts
  fl_chart: ^1.2.0

  # PDF and Export
  pdf: ^3.10.0
  printing: ^5.13.1
  excel: ^4.0.6
  file_saver: ^0.3.1

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # Utilities
  uuid: ^4.0.0
  crypto: ^3.0.0

  # Image Picker (Teachers module)
  image_picker: ^1.0.0
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

